spring.application.name=smart-grid-monitor

# Dev Mode (H2)
spring.datasource.url=jdbc:h2:mem:smartgrid
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port: ${PORT:8082}

# CORS
cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# WebSocket
spring.websocket.path=/grid-websocket
spring.websocket.sockjs.default-mapping=/grid-websocket

# Disable unnecessary auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Logging
logging.level.com.smartgrid=INFO
logging.level.org.springframework.web.socket=INFO