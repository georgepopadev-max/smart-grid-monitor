spring.application.name=smart-grid-monitor
server.port: ${PORT:8080}

# CORS
cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# WebSocket
spring.websocket.path=/grid-websocket
spring.websocket.sockjs.default-mapping=/grid-websocket

# Disable unnecessary auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Logging
logging.level.com.smartgrid=INFO
logging.level.org.springframework.web.socket=INFO