version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartgrid-postgres
    environment:
      POSTGRES_DB: smartgrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_smartgrid_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartgrid-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5434
      DB_NAME: smartgrid
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8082
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_smartgrid_data: